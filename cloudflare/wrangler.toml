name = "edunexus-ai"
main = "src/index.ts"
compatibility_date = "2024-04-05"

# R2 Bucket for Study Materials and Assignments
[[r2_buckets]]
binding = "STORAGE"
bucket_name = "edunexus-storage"

# Vectorize Index for RAG Search
[[vectorize]]
binding = "VECTOR_INDEX"
index_name = "edunexus-materials"

# AI Binding for Llama 3 / Embeddings
[ai]
binding = "AI"

[stream]
binding = "STREAM"

[vars]
# Public URL for R2 objects (custom domain or r2.dev). Leave empty to use /api/files/:key in dev.
R2_PUBLIC_URL = ""
# Cloudflare TURN Server configuration for Telehealth WebRTC
TURN_TOKEN_ID = "eb02d0ad772fc588489375fe26e9308a"
TURN_API_TOKEN = "f65aca7d5c89d2c3240cd7a754201e2046f5545e32843c5d941f7d51c8a61322"

